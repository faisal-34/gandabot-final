workflows:
  ios-capacitor-workflow:
    name: GandaBot iOS – App Store
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic_ASC_Key
    environment:
      node: v20.11.0
      xcode: latest
      cocoapods: default
    working_directory: gandabot-nextjs-clerk-v2
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Add Capacitor iOS platform
        script: |
          # Only add if ios/ folder doesn't exist yet
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "ios/ already present, skipping cap add"
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # ── Revoke ALL existing Distribution certs so Apple allows --create ──
          # Apple limits accounts to 2 distribution certs.  Each ephemeral
          # Codemagic Mac generates a new private key, so existing portal certs
          # never match.  Write IDs to a file (avoids subshell env issues with
          # piped while-loops) then delete each one.
          echo "=== Revoking existing IOS_DISTRIBUTION certificates ==="
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --json 2>/dev/null \
          | python3 -c "
import sys, json
try:
    data = json.loads(sys.stdin.read())
    certs = data if isinstance(data, list) else data.get('data', [])
    for c in certs:
        cid = c.get('id') if isinstance(c, dict) else None
        if cid:
            print(cid)
except Exception as e:
    sys.stderr.write(str(e))
" > /tmp/cert_ids.txt 2>/dev/null || true

          if [ -s /tmp/cert_ids.txt ]; then
            while IFS= read -r CERT_ID; do
              echo "  Revoking: $CERT_ID"
              app-store-connect certificates delete "$CERT_ID" || true
            done < /tmp/cert_ids.txt
            echo "  Sleeping 5s for Apple API to propagate deletions..."
            sleep 5
          else
            echo "  No existing distribution certs found."
          fi

          # ── Generate a fresh private key for the new cert ──────────────────
          echo "=== Generating fresh certificate private key ==="
          export CERTIFICATE_PRIVATE_KEY=$(openssl genrsa 2048)

          # ── Fetch/create cert + provisioning profile ───────────────────────
          echo "=== Fetching/creating signing files ==="
          app-store-connect fetch-signing-files \
            com.gandabot.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
