workflows:
  ios-capacitor-workflow:
    name: GandaBot iOS – App Store
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic_ASC_Key
    environment:
      node: v20.11.0
      xcode: latest
      cocoapods: default
    working_directory: gandabot-nextjs-clerk-v2
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Add Capacitor iOS platform
        script: |
          # Only add if ios/ folder doesn't exist yet
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "ios/ already present, skipping cap add"
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # ── Delete stale distribution certs left by previous builds ──────────
          # Each Codemagic Mac is ephemeral; old certs in the portal have no
          # matching private key here → causes "Cannot save Signing Certificates
          # without certificate private key".  Wipe them so --create starts fresh.
          echo "=== Purging stale IOS_DISTRIBUTION certificates ==="
          STALE_IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null \
            | python3 -c "import sys,json; [print(c['id']) for c in json.load(sys.stdin) if c.get('id')]" \
            2>/dev/null || true)

          if [ -n "$STALE_IDS" ]; then
            echo "$STALE_IDS" | while IFS= read -r cid; do
              echo "  Deleting cert $cid"
              app-store-connect certificates delete "$cid" || true
            done
          else
            echo "  No stale certs found."
          fi

          # ── Create fresh cert (private key generated on THIS Mac) + profile ──
          echo "=== Fetching/creating signing files ==="
          app-store-connect fetch-signing-files \
            com.gandabot.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
